name: Verify portfolio content

on:
  pull_request:
  push:
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/**"
      - "pics/crebain-logo.png"
      - "assets/agents-*.svg"
      - "assets/connect-*.svg"
      - "assets/rail-*.svg"
      - "assets/repo-tree-*.svg"
      - "assets/social-*.svg"
      - "assets/work-card-*.svg"
      - "assets/work-graph-*.svg"
      - "assets/title-*.svg"
      - ".github/workflows/content.yml"

permissions:
  contents: read

jobs:
  generated-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Check source syntax and synchronized content
        run: |
          for script in scripts/*.mjs; do node --check "$script"; done
          node --test scripts/*.test.mjs
          node scripts/sync-selected-work.mjs --check

      - name: Check deterministic generated SVGs
        run: |
          node scripts/agents.mjs
          node scripts/connect.mjs
          node scripts/repo-tree.mjs
          node scripts/socials.mjs
          node scripts/toolbox-rails.mjs
          node scripts/work-graph.mjs
          node scripts/section-titles.mjs
          git add --intent-to-add assets/agents-*.svg assets/connect-*.svg assets/rail-*.svg assets/repo-tree-*.svg assets/social-*.svg assets/work-graph-*.svg assets/title-*.svg
          git diff --exit-code -- assets/agents-*.svg assets/connect-*.svg assets/rail-*.svg assets/repo-tree-*.svg assets/social-*.svg assets/work-graph-*.svg assets/title-*.svg
