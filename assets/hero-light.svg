<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 176" width="860" height="176" role="img" aria-label="Sepehr Mahmoudian is a Senior AI Engineer in Berlin, Germany, building domain-specific AI agents and custom harnesses, with work spanning LLM/VLM evaluation and AI traceability, knowledge graphs, Graph RAG, data provenance, model validation, Partial Information Decomposition, computational neuroscience, robotics and multimodal 3D perception. Primary languages: Rust and Python. Building on GitHub since 2014.">
  <title>Sepehr Mahmoudian — Senior AI Engineer, Berlin</title>
  <desc>Sepehr Mahmoudian is a Senior AI Engineer in Berlin, Germany, building domain-specific AI agents and custom harnesses, with work spanning LLM/VLM evaluation and AI traceability, knowledge graphs, Graph RAG, data provenance, model validation, Partial Information Decomposition, computational neuroscience, robotics and multimodal 3D perception. Primary languages: Rust and Python. Building on GitHub since 2014.</desc>
  <style>
    .wordmark { font: 700 40px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0891b2; letter-spacing: -1px; }
    .role { font: 500 19px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1f2328; }
    .meta { font: 400 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #57606a; }
    .role-cur { visibility: hidden; fill: #1f2328; }
    .sweep { transform: translateX(0); animation: sweep 3.2s linear infinite; }
    @keyframes sweep { from { transform: translateX(-100px); } to { transform: translateX(620px); } }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

    .seq1 { animation: seq1 15s linear infinite; }
    .type1 { animation: type1 15s steps(65, end) infinite; }
    .cur1 { animation: cursor1 15s steps(65, end) infinite, blink 1s steps(1) infinite; }
    @keyframes seq1 {
      0%, 0% { opacity: 0; }
      0.0667%, 30.6667% { opacity: 1; }
      32.6667%, 100% { opacity: 0; }
    }
    @keyframes type1 {
      0%, 0% { width: 0; }
      12%, 32.6667% { width: 715px; }
      33.2667%, 100% { width: 0; }
    }
    @keyframes cursor1 {
      0%, 0% { visibility: hidden; transform: translateX(-715px); }
      0.0667% { visibility: visible; transform: translateX(-715px); }
      12%, 30.6667% { visibility: visible; transform: translateX(0); }
      32.6667%, 100% { visibility: hidden; transform: translateX(0); }
    }

    .seq2 { animation: seq2 15s linear infinite; }
    .type2 { animation: type2 15s steps(65, end) infinite; }
    .cur2 { animation: cursor2 15s steps(65, end) infinite, blink 1s steps(1) infinite; }
    @keyframes seq2 {
      0%, 33.3333% { opacity: 0; }
      33.4%, 64% { opacity: 1; }
      66%, 100% { opacity: 0; }
    }
    @keyframes type2 {
      0%, 33.3333% { width: 0; }
      45.3333%, 66% { width: 715px; }
      66.6%, 100% { width: 0; }
    }
    @keyframes cursor2 {
      0%, 33.3333% { visibility: hidden; transform: translateX(-715px); }
      33.4% { visibility: visible; transform: translateX(-715px); }
      45.3333%, 64% { visibility: visible; transform: translateX(0); }
      66%, 100% { visibility: hidden; transform: translateX(0); }
    }

    .seq3 { animation: seq3 15s linear infinite; }
    .type3 { animation: type3 15s steps(70, end) infinite; }
    .cur3 { animation: cursor3 15s steps(70, end) infinite, blink 1s steps(1) infinite; }
    @keyframes seq3 {
      0%, 66.6667% { opacity: 0; }
      66.7333%, 97.3333% { opacity: 1; }
      99.3333%, 100% { opacity: 0; }
    }
    @keyframes type3 {
      0%, 66.6667% { width: 0; }
      78.6667%, 99.3333% { width: 770px; }
      99.9333%, 100% { width: 0; }
    }
    @keyframes cursor3 {
      0%, 66.6667% { visibility: hidden; transform: translateX(-770px); }
      66.7333% { visibility: visible; transform: translateX(-770px); }
      78.6667%, 97.3333% { visibility: visible; transform: translateX(0); }
      99.3333%, 100% { visibility: hidden; transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .seq1, .seq2, .seq3, .cur1, .cur2, .cur3 { animation: none; }
      .type-window, .sweep { animation: none; }
      .cur1, .cur2, .cur3, .sweep { visibility: hidden; }
    }
  </style>
  <defs>
    <clipPath id="typing-1" clipPathUnits="userSpaceOnUse"><rect x="40" y="96" width="715" height="36" class="type-window type1"/></clipPath>
    <clipPath id="typing-2" clipPathUnits="userSpaceOnUse"><rect x="40" y="96" width="715" height="36" class="type-window type2"/></clipPath>
    <clipPath id="typing-3" clipPathUnits="userSpaceOnUse"><rect x="40" y="96" width="770" height="36" class="type-window type3"/></clipPath>
    <clipPath id="underline"><rect x="40" y="83" width="500" height="6" rx="3"/></clipPath>
    <linearGradient id="sweep"><stop offset="0" stop-color="#0891b2" stop-opacity="0"/><stop offset=".5" stop-color="#0891b2"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></linearGradient>
  </defs>
  <text x="40" y="68" class="wordmark" textLength="500" lengthAdjust="spacingAndGlyphs">Sepehr Mahmoudian</text>
  <line x1="40" y1="86" x2="540" y2="86" stroke="#d0d7de" stroke-width="2"/>
  <g clip-path="url(#underline)"><rect x="0" y="83" width="120" height="6" fill="url(#sweep)" class="sweep"/></g>
  <text x="40" y="124" textLength="715" lengthAdjust="spacingAndGlyphs" clip-path="url(#typing-1)" class="role seq1" opacity="1">Domain-specific AI Agents · Custom Harnesses · LLM/VLM Evaluation</text>
  <rect x="755" y="108" width="9" height="20" rx="1" visibility="hidden" class="role-cur cur1"/>
  <text x="40" y="124" textLength="715" lengthAdjust="spacingAndGlyphs" clip-path="url(#typing-2)" class="role seq2" opacity="0">Knowledge Graphs · Graph RAG · Data Provenance · Model Validation</text>
  <rect x="755" y="108" width="9" height="20" rx="1" visibility="hidden" class="role-cur cur2"/>
  <text x="40" y="124" textLength="770" lengthAdjust="spacingAndGlyphs" clip-path="url(#typing-3)" class="role seq3" opacity="0">PID · Computational Neuroscience · Robotics · Multimodal 3D Perception</text>
  <rect x="810" y="108" width="9" height="20" rx="1" visibility="hidden" class="role-cur cur3"/>
  <text x="40" y="158" class="meta">High Energy  ·  High Agency  ·  Takes Initiative  ·  Consistent</text>
</svg>
