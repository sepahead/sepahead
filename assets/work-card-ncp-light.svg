<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395 150" width="395" height="150" role="img" aria-label="NCP (16 stars): Local simulation contract: exact steps and retained outcomes across native owners. v1 candidate; installed release gates remain open.">
  <defs>
    <radialGradient id="wash0" cx="8%" cy="0%" r="120%"><stop offset="0%" stop-color="#332408" stop-opacity="0.9"/><stop offset="60%" stop-color="#332408" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .card       { fill: #0d1117; fill-opacity: 1; stroke: #ffffff; stroke-opacity: 0.09; stroke-width: 1; }
    .title      { font: 700 17px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .desc       { font: 400 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #9da7b3; }
    .badge      { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .chip       { fill: #0d1117; fill-opacity: 0.6; stroke-width: 1.3; }
    .chip-label { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .c0.title { fill: #fbbf24; } .c0.rule { fill: #fbbf24; } .c0.spine { stroke: #fbbf24; } .c0.badge { fill: #fbbf24; } .c0.chip { stroke: #fbbf24; } .c0.chip-label { fill: #fbbf24; } .c0.glyph-fill { fill: #fbbf24; } .c0.glyph-stroke { stroke: #fbbf24; }
    text { paint-order: stroke; stroke: #0d1117; stroke-width: 2.6; stroke-linejoin: round; }
    text { stroke: #ffffff; }
      .card { fill: #ffffff; fill-opacity: 1; stroke: #0b1f2a; stroke-opacity: 0.1; }
      /* The accent wash is a dark-mode bloom; on white it only muddies the
         card, so hide it entirely in light mode (the accent spine + title
         carry the colour there). */
      .wash { display: none; }
      .desc { fill: #57606a; }
      .chip { fill: #ffffff; fill-opacity: 0.7; }
      .c0.title { fill: #b45309; } .c0.rule { fill: #b45309; } .c0.spine { stroke: #b45309; } .c0.badge { fill: #b45309; } .c0.chip { stroke: #b45309; } .c0.chip-label { fill: #b45309; } .c0.glyph-fill { fill: #b45309; } .c0.glyph-stroke { stroke: #b45309; }
  </style>
