<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 52" width="860" height="52" role="img" aria-label="The toolbox">
  <title>The toolbox</title>
  <style>
    .idx    { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #fbbf24; letter-spacing: 1px; }
    .prompt { font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8b949e; }
    .caret  { fill: #fbbf24; }
    .label  { font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #c9d1d9; letter-spacing: 4px; }
    .cap    { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8b949e; letter-spacing: 2px; }
    .spine  { stroke: #fbbf24; stroke-width: 4; stroke-linecap: round; }
    .rule   { stroke: #30363d; stroke-width: 1; }
    .cursor { fill: #fbbf24; animation: curblink 1s steps(1) 0.8s infinite; }
    @keyframes curblink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    text { paint-order: stroke; stroke: #0d1117; stroke-width: 2.6; stroke-linejoin: round; }
    @media (prefers-reduced-motion: reduce) {
      animate { display: none; }
      .cursor { animation: none; visibility: hidden; }
    }
  </style>
  <path d="M4 13 V39" class="spine"/>
  <text x="22" y="33" class="idx">03</text>
  <text x="50" y="33" class="prompt">~/sep <tspan class="caret">&#10095;</tspan></text>
  <text x="132" y="33" class="label" textLength="132" lengthAdjust="spacingAndGlyphs">THE TOOLBOX</text>
  <text x="856" y="33" text-anchor="end" class="cap"># 4 stacks</text>
  <line x1="132" y1="42.5" x2="856" y2="42.5" class="rule"/>
  <rect x="274" y="22" width="9" height="14" rx="1" class="cursor"/>
</svg>
