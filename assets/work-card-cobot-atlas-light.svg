      .c0.title { fill: #2563eb; } .c0.rule { fill: #2563eb; } .c0.spine { stroke: #2563eb; } .c0.badge { fill: #2563eb; } .c0.chip { stroke: #2563eb; } .c0.chip-label { fill: #2563eb; } .c0.glyph-fill { fill: #2563eb; } .c0.glyph-stroke { stroke: #2563eb; }
