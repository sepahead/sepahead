<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 395 150" width="395" height="150" role="img" aria-label="cobot-atlas (dataset, 1,862 all-time downloads): Generation pipeline for 2,023 unique robot/cobot simulation meshes; 2,024 GLBs, 33.5 GB on Hugging Face with dataset and pipeline DOIs.">
