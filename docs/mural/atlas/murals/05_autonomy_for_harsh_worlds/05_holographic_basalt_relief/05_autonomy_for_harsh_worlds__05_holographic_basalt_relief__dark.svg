<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-labelledby="title-05_autonomy_for_harsh_worlds-05_holographic_basalt_relief-dark desc-05_autonomy_for_harsh_worlds-05_holographic_basalt_relief-dark">
  <title id="title-05_autonomy_for_harsh_worlds-05_holographic_basalt_relief-dark">AUTONOMY FOR HARSH WORLDS - Holographic Basalt Relief</title>
  <desc id="desc-05_autonomy_for_harsh_worlds-05_holographic_basalt_relief-dark">An Earth-first wedge in remote inspection expands toward orbital and off-world systems where bounded autonomy matters more. The composition reads left to right through infra, remote, air, orbit, moon, mars. Solid luminous lines indicate direct evidence, dashed lines indicate conceptual or conditional relationships, and translucent elements indicate a future thesis. The 96-second animation explains sensing, routing, authorization, verification, or exploration and stops when reduced motion is requested.</desc>

  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1721"/><stop offset=".55" stop-color="#0a1017"/><stop offset="1" stop-color="#05080d"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#67e8f9"/><stop offset="20%" stop-color="#22d3ee"/><stop offset="40%" stop-color="#60a5fa"/><stop offset="60%" stop-color="#5eead4"/><stop offset="80%" stop-color="#c084fc"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient>
    <linearGradient id="scanFade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <radialGradient id="moon" cx="34%" cy="30%"><stop stop-color="#ffffff"/><stop offset=".68" stop-color="#cbd5e1"/><stop offset="1" stop-color="#c8d4df"/></radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity=".42"/></filter>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="7" cy="9" r="1" fill="#eef6ff" opacity=".08"/><circle cx="33" cy="24" r=".8" fill="#eef6ff" opacity=".06"/><path d="M0 42L48 6" stroke="#eef6ff" stroke-opacity=".025"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1l8 4-8 4z" fill="#22d3ee"/></marker>
  </defs>

  <style>
    .bg { fill:#05080d; }
    .frame { fill:url(#frameGrad); stroke:#2d4356; stroke-width:2; }
    .inner { fill:none; stroke:#172735; stroke-width:1.4; }
    .rule { stroke:#2d4356; stroke-width:1.5; }
    .hairline { stroke:#172735; stroke-width:1; }
    .title { font:700 30px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:5px; fill:#eef6ff; }
    .subtitle { font:500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill:#8fa4b8; }
    .cap { font:600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:2px; fill:#8fa4b8; }
    .stage-label { font:700 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:2px; fill:#eef6ff; }
    .small { font:600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:1px; fill:#8fa4b8; }
    .micro { font:600 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:1.4px; fill:#8fa4b8; }
    .claim { font:500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill:#8fa4b8; }
    .lead { fill:#020509; stroke:#020509; stroke-width:7; stroke-linejoin:round; }
    .glass { stroke:#020509; stroke-width:7; stroke-linejoin:round; }
    .glass-1 { fill:#67e8f9; fill-opacity:0.60; }
    .glass-2 { fill:#22d3ee; fill-opacity:0.60; }
    .glass-3 { fill:#60a5fa; fill-opacity:0.60; }
    .glass-4 { fill:#5eead4; fill-opacity:0.60; }
    .glass-5 { fill:#c084fc; fill-opacity:0.60; }
    .glass-6 { fill:#cbd5e1; fill-opacity:0.60; }
    .scene-line { fill:none; stroke:#eef6ff; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
    .scene-muted { fill:none; stroke:#8fa4b8; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .evidence { fill:none; stroke:#22d3ee; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; filter:url(#softGlow); }
    .concept { fill:none; stroke:#60a5fa; stroke-width:2.3; stroke-dasharray:10 10; stroke-linecap:round; opacity:.78; }
    .future { fill:none; stroke:#cbd5e1; stroke-width:2; stroke-dasharray:3 12; stroke-linecap:round; opacity:.55; }
    .packet { fill:#eef6ff; stroke:#22d3ee; stroke-width:2; filter:url(#glow); }
    .hot { fill:#22d3ee; filter:url(#glow); }
    .warm { fill:#67e8f9; filter:url(#softGlow); }
    .ok { fill:#5eead4; filter:url(#softGlow); }
    .deny { fill:#c084fc; filter:url(#softGlow); }
    .person { fill:#c084fc; stroke:#020509; stroke-width:3; }
    .skin { fill:#cbd5e1; stroke:#020509; stroke-width:3; }
    .motif { fill:none; stroke:#2d4356; stroke-width:2; }
    .roots { stroke:#22d3ee; stroke-width:2.5; }
    .chart { stroke:#67e8f9; stroke-width:1.5; }
    .miniature { stroke:#67e8f9; stroke-width:2; }
    .holo-grid { stroke:#22d3ee; stroke-width:1; }
    .holo-scan { opacity:.32; }
    .grain { fill:url(#grain); opacity:.8; }
    .timeline { fill:#0e1721; stroke:#2d4356; stroke-width:2; }
    .timeline-done { fill:url(#spectrum); filter:url(#softGlow); }
    .timeline-node { fill:#0a1017; stroke:#2d4356; stroke-width:3; }
    .timeline-core { fill:#22d3ee; filter:url(#softGlow); }
    .timeline-label { font:700 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:1.4px; fill:#8fa4b8; }
    .tag { fill:#0a1017; stroke:#2d4356; stroke-width:1.4; }
    .tag-dot { fill:#22d3ee; }
    .tag-text { font:600 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing:1px; fill:#eef6ff; }
    .scan { animation:scan 24.00s ease-in-out infinite; }
    .breathe { transform-box:fill-box; transform-origin:center; animation:breathe 8s ease-in-out infinite; }
    .orbit { transform-box:fill-box; transform-origin:center; animation:orbit 24s linear infinite; }
    .twinkle { animation:twinkle 6s ease-in-out infinite; }
    .spore { transform-box:fill-box; transform-origin:center; animation:spore 13s ease-in-out infinite; }
    .s1 { animation-delay:-2s } .s2 { animation-delay:-4s } .s3 { animation-delay:-6s }
    .s4 { animation-delay:-8s } .s5 { animation-delay:-10s } .s6 { animation-delay:-12s }
    .story-beam { stroke-dasharray:20 18; animation:flow 8s linear infinite; }
    .reveal-1 { animation:reveal 96s ease-in-out infinite; animation-delay:0s; }
    .reveal-2 { animation:reveal 96s ease-in-out infinite; animation-delay:-80.00s; }
    .reveal-3 { animation:reveal 96s ease-in-out infinite; animation-delay:-64.00s; }
    .reveal-4 { animation:reveal 96s ease-in-out infinite; animation-delay:-48.00s; }
    .reveal-5 { animation:reveal 96s ease-in-out infinite; animation-delay:-32.00s; }
    .reveal-6 { animation:reveal 96s ease-in-out infinite; animation-delay:-16.00s; }
    @keyframes scan { 0%,100%{transform:translateX(-38px);opacity:.18}50%{transform:translateX(66px);opacity:.9} }
    @keyframes breathe { 0%,100%{opacity:.72;transform:scale(.98)}50%{opacity:1;transform:scale(1.035)} }
    @keyframes orbit { to{transform:rotate(360deg)} }
    @keyframes twinkle { 0%,100%{opacity:.15}50%{opacity:.72} }
    @keyframes spore { 0%,100%{transform:translateY(18px);opacity:.12}50%{transform:translateY(-28px);opacity:.65} }
    @keyframes flow { to{stroke-dashoffset:-76} }
    @keyframes reveal { 0%,8%,100%{opacity:.42}12%,26%{opacity:1}31%,95%{opacity:.42} }
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform, animateMotion { display:none; }
      .scan,.breathe,.orbit,.twinkle,.spore,.story-beam,.reveal-1,.reveal-2,.reveal-3,.reveal-4,.reveal-5,.reveal-6 { animation:none; }
    }
  </style>
